<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would you rather</title>
    <!-- Load Vue 3 so the page can use Vue templates and directives. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <!-- Vue controls the content inside this div. -->
    <div id="app">
        <h1>Would You Rather...</h1>


        <!-- Display the question returned by the API. -->
        <h2 id="question"> {{ wyr.question }}</h2>

        <!-- Both radio buttons use v-model to store the selected answer in userChoice. -->
        <fieldset id="wyr-choices">
            <input id="answer1-radio" type="radio" name="answer" v-bind:value="wyr.answer1" v-model="userChoice">
            <label id="answer1-label" for="answer1-radio">{{ wyr.answer1 }}</label>

            <input id="answer2-radio" type="radio" name="answer" v-bind:value="wyr.answer2" v-model="userChoice">
            <label id="answer2-label" for="answer2-radio"> {{ wyr.answer2 }}</label>

        </fieldset>

        </fieldset>

        <!-- Show the confirmation only after the user selects an answer. -->
        <p v-if="userChoice" id="response-confirmation">Thanks! you chose <strong>{{ userChoice }}</strong>s</p>

        <p>This is a Vue and Express app running at Azure</p>
    </div>
    <script>


        // Use a relative URL to request a question from the Express API.
        const randomWYRQuestionURL = 'api/wyr'

        // fetch(randomWYRQuestionURL)
        //     .then(response => response.json())
        //     .then(wyrData => {

        //     })
        //     .catch(err => {
        //         console.error(err)
        //         alert('Sorry, no Would You Rather questions today')
        //     })


        const { createApp, onMounted, ref } = Vue

        createApp({
            setup() {

                // Store the question data and selected answer so Vue can update the page.
                const wyr = ref({})
                const userChoice = ref('')

                // Fetch a random question after Vue mounts the app.
                onMounted(() => {

                    fetch(randomWYRQuestionURL)
                        .then(response => response.json())
                        .then(wyrData => {
                            console.log(wyrData)
                            // Updating the ref displays the new question and both answers.
                            wyr.value = wyrData
                        })
                        .catch(err => {
                            console.error(err)
                            alert('Sorry, no Would You Rather questions today')
                        })

                })  // end of onMounted

                // Make both variables available to the HTML template.
                return {
                    wyr,
                    userChoice
                }
            }
        }).mount('#app')


    </script>

</body>

</html>
